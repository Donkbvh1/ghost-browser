name: Build Android APK & Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Generate Android Platform & Inject Permissions
        run: |
          flutter create --platforms=android --project-name ghost_browser .
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml
      - name: Restore App Code & Build Release APK
        run: |
          git checkout lib/main.dart pubspec.yaml
          flutter pub get
          flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowse-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Generate Windows Platform & Build EXE
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name ghost_browser .
          git checkout lib/main.dart pubspec.yaml
          flutter pub get
          flutter build windows --release
      - name: Upload Windows Portable App
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowse-Windows-EXE
          path: build/windows/x64/runner/Release/
